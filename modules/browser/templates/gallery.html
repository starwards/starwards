<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Starwards Visual Gallery</title>
        <link type="text/css" rel="stylesheet" href="styles/index.css" />
        <style>
            html,
            body {
                overflow: hidden;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background: #0f0f0f;
            }
            #gallery-layout {
                display: flex;
                align-items: flex-start;
                height: 100%;
                width: 100%;
            }
            /* Screenshots are taken of this element, so it is sized to the widget it holds and
               nothing else — see fitToContent() in gallery.ts. */
            #container {
                flex: 0 0 auto;
            }
            #panel-container {
                width: 280px;
                min-width: 280px;
                margin-left: auto;
                align-self: stretch;
                background: #1a1a1a;
                overflow-y: auto;
            }
            #error {
                color: #ff4444;
                font-family: monospace;
                padding: 20px;
                display: none;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            #scene-list {
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="gallery-layout">
            <div id="container"></div>
            <div id="panel-container"></div>
        </div>
        <div id="error"></div>
        <div id="scene-list"></div>
    </body>
</html>
