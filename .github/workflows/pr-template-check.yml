name: PR Template Check

on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

permissions:
    contents: read
    pull-requests: read

jobs:
    pr-template-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/github-script@v7
              with:
                  script: |
                      const body = context.payload.pull_request.body || '';

                      // The PR template marks a "MUST fill in" section. We
                      // require it to be present and to contain no unchecked
                      // boxes. This protects against blind LLM PRs that delete
                      // the section or open with an empty body.
                      const mustHeader = 'MUST fill in';
                      if (!body.includes(mustHeader)) {
                          core.setFailed(
                              'PR body is missing the "MUST fill in" section ' +
                              'from .github/pull_request_template.md. ' +
                              'Restore the template and re-tick the boxes.'
                          );
                          return;
                      }

                      // Find unchecked boxes ("- [ ]"). Allow lowercase x or
                      // uppercase X to count as checked.
                      const lines = body.split(/\r?\n/);
                      const unchecked = lines
                          .map((line, i) => ({ line, i }))
                          .filter(({ line }) => /^\s*-\s*\[\s\]/.test(line));

                      if (unchecked.length > 0) {
                          const preview = unchecked
                              .slice(0, 10)
                              .map(({ line, i }) => `  L${i + 1}: ${line.trim()}`)
                              .join('\n');
                          core.setFailed(
                              `PR body has ${unchecked.length} unchecked ` +
                              `checkbox(es) in the template. Tick each one ` +
                              `(or delete it with justification in the ` +
                              `summary). First few:\n${preview}`
                          );
                          return;
                      }

                      core.info('PR template checklist looks good.');
