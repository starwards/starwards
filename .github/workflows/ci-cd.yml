name: CI

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    merge_group:

jobs:
    Test-Static:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: node --version
            - run: npm --version
            - run: npm ci
            - run: npm run test:types
            - run: npm run test:format
            # depcheck resolves @starwards/core/internal through package
            # "exports" (built cjs/), so core must be built. The full build
            # (browser/server/node-red/mcp) is covered by the Build job.
            - run: npm run build:core
            - run: npm run depcheck

    Test-Units-Shard:
        # sharded so the slow simulation suites spread over 3 runners; Test-Units below aggregates
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
            # jest orders suites slowest-first from timings kept in its cache
            - name: Cache jest
              uses: actions/cache@v4
              with:
                  path: /tmp/jest-cache
                  key: jest-${{ matrix.shard }}-${{ github.sha }}
                  restore-keys: jest-${{ matrix.shard }}-
            # weighted split (scripts/ci-shard.mjs); jest --shard splits by path hash and left one shard 3x slower
            - name: Run unit tests
              shell: bash
              run: |
                  set -f
                  files=$(node scripts/ci-shard.mjs unit ${{ matrix.shard }} 3)
                  npm run test -- --maxWorkers=4 --cacheDirectory=/tmp/jest-cache --reporters=default --reporters=jest-junit --runTestsByPath $files
              env:
                  JEST_JUNIT_OUTPUT_DIR: ./test-results
                  JEST_JUNIT_OUTPUT_NAME: junit-${{ matrix.shard }}.xml
            - name: Store test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: unit-test-results-${{ matrix.shard }}
                  path: test-results/junit-${{ matrix.shard }}.xml

    Test-Units:
        # keeps the required check name; passes only when every shard passed
        runs-on: ubuntu-latest
        needs: Test-Units-Shard
        if: always()
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: unit-test-results-*
                  path: test-results
                  merge-multiple: true
            - name: Publish Test Report
              uses: mikepenz/action-junit-report@v4
              if: always()
              with:
                  report_paths: './test-results/junit-*.xml'
                  check_name: 'Unit Test Results'
            - name: Store test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: unit-test-results
                  path: test-results
            - name: Fail if any shard failed
              if: needs.Test-Units-Shard.result != 'success'
              run: exit 1

    Test-E2e-Shard:
        # shards 1-4 split every other e2e file by weight; 5-6 split the visual gallery by test.
        # Test-E2e below aggregates.
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-jammy
            options: --user 1001
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, 6]
        steps:
            - uses: actions/checkout@v4
            # Skip the heavy build+e2e work on docs-only changes. Fails open:
            # any doubt (missing base sha, git error) means code=true and the
            # full job runs, so tests can never be skipped by accident.
            - name: Detect non-docs changes
              id: changes
              shell: bash
              run: |
                  set +e
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
                  git fetch --depth=1 origin "$BASE" 2>/dev/null
                  CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null)
                  if [ -z "$CHANGED" ]; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  elif echo "$CHANGED" | grep -qvE '^docs/|\.md$'; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "docs-only change detected, skipping e2e"
                      echo "code=false" >> "$GITHUB_OUTPUT"
                  fi
                  exit 0
            - name: Set up Node.js
              if: steps.changes.outputs.code == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
              if: steps.changes.outputs.code == 'true'
            - run: npm run build:core
              if: steps.changes.outputs.code == 'true'
            - run: npm run build:server
              if: steps.changes.outputs.code == 'true'
            - run: npm --prefix modules/browser run build
              if: steps.changes.outputs.code == 'true'
            # weighted split (scripts/ci-shard.mjs); playwright --shard splits by order and left shards 3x apart
            - name: Run e2e tests
              if: steps.changes.outputs.code == 'true'
              shell: bash
              run: |
                  set -f
                  if [ ${{ matrix.shard }} -le 4 ]; then
                      files=$(node scripts/ci-shard.mjs e2e-rest ${{ matrix.shard }} 4)
                      npm run test:e2e -- $files
                  else
                      npm run test:e2e -- --shard=$(( ${{ matrix.shard }} - 4 ))/2 modules/e2e/test/visual/gallery.spec.ts
                  fi
            - name: Store test results
              uses: actions/upload-artifact@v4
              if: steps.changes.outputs.code == 'true'
              with:
                  name: playwright-results-${{ matrix.shard }}
                  path: playwright-results.xml
            - name: Store artifacts
              uses: actions/upload-artifact@v4
              if: steps.changes.outputs.code == 'true'
              with:
                  name: test-results-${{ matrix.shard }}
                  path: test-results
                  if-no-files-found: ignore

    Test-E2e:
        # keeps the required check name; passes only when every shard passed
        runs-on: ubuntu-latest
        needs: Test-E2e-Shard
        if: always()
        steps:
            - name: Fail if any shard failed
              if: needs.Test-E2e-Shard.result != 'success'
              run: exit 1

    Test-Visual-Shard:
        # sharded over 2 runners; Test-Visual below aggregates
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-jammy
            options: --user 1001
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - uses: actions/checkout@v4
            # Same fail-open docs-only gate as Test-E2e.
            - name: Detect non-docs changes
              id: changes
              shell: bash
              run: |
                  set +e
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
                  git fetch --depth=1 origin "$BASE" 2>/dev/null
                  CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null)
                  if [ -z "$CHANGED" ]; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  elif echo "$CHANGED" | grep -qvE '^docs/|\.md$'; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "docs-only change detected, skipping visual tests"
                      echo "code=false" >> "$GITHUB_OUTPUT"
                  fi
                  exit 0
            - name: Set up Node.js
              if: steps.changes.outputs.code == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
              if: steps.changes.outputs.code == 'true'
            - run: npm run build:core
              if: steps.changes.outputs.code == 'true'
            - run: npm run build:server
              if: steps.changes.outputs.code == 'true'
            - run: npm --prefix modules/browser run build
              if: steps.changes.outputs.code == 'true'
            - run: xvfb-run npm run test:widgets -- --shard=${{ matrix.shard }}/2
              if: steps.changes.outputs.code == 'true'
            - name: Upload snapshot diffs
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: visual-test-diffs-${{ matrix.shard }}
                  path: test-results
                  if-no-files-found: ignore

    Test-Visual:
        # keeps the required check name; passes only when every shard passed
        runs-on: ubuntu-latest
        needs: Test-Visual-Shard
        if: always()
        steps:
            - name: Fail if any shard failed
              if: needs.Test-Visual-Shard.result != 'success'
              run: exit 1

    AI-Controls:
        # $0 harness check: the reference crew must kill on T0, the idle crew must not.
        # No Jev seat runs here; the Jev client refuses to start when CI is set.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
            - run: npm run build:core
            - run: npm run build:server
            - run: >-
                  npm --prefix modules/ai run train -- --scenario T0 --seeds 8 --timeout 180 --workers 4
                  --crew crews/reference.json --crew crews/idle.json --out ai-controls
                  --expect-kills reference=7-8 --expect-kills idle=0-0
            - name: Store report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ai-controls
                  path: modules/ai/ai-controls/*.md
                  if-no-files-found: ignore

    coverage-core-shard:
        # core tests with coverage, split over 3 runners; coverage-core below merges and checks thresholds
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
            - name: Run core tests with coverage
              shell: bash
              run: |
                  set -f
                  files=$(node scripts/ci-shard.mjs core ${{ matrix.shard }} 3)
                  npx jest --maxWorkers=4 --coverage --coverageReporters=json --coverageDirectory=coverage-shard --collectCoverageFrom='modules/core/src/**/*.ts' --runTestsByPath $files
            - name: Store shard coverage
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-core-shard-${{ matrix.shard }}
                  path: coverage-shard/coverage-final.json
                  if-no-files-found: error

    coverage-core:
        # Coverage gate scoped to modules/core only. Started at a low
        # threshold so it passes against current main; ratchet up by +5pp
        # every release until we hit ~70%. See PR5 for backfill plan.
        # Merges the shards and checks the thresholds from test:coverage:core in package.json;
        # keeps the required check name.
        runs-on: ubuntu-latest
        needs: coverage-core-shard
        if: always()
        steps:
            - name: Fail if any shard failed
              if: needs.coverage-core-shard.result != 'success'
              run: exit 1
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
            - uses: actions/download-artifact@v4
              with:
                  pattern: coverage-core-shard-*
                  path: coverage-shards
            - run: node scripts/merge-coverage.mjs coverage-shards coverage-core
            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-core
                  path: coverage-core
                  if-no-files-found: ignore

    Build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - name: Cache pkg-fetch node binaries
              uses: actions/cache@v4
              with:
                  path: ~/.pkg-cache
                  key: pkg-cache-${{ hashFiles('package-lock.json') }}
            - run: node --version
            - run: npm --version
            - run: npm ci
            - run: npm run build
            - run: npm run pkg
            - name: Store Windows executable
              uses: actions/upload-artifact@v4
              with:
                  name: Windows executable
                  path: dist/exec/starwards-win.exe
                  if-no-files-found: error
            - name: Smoke test packaged Linux server
              run: |
                  set -e
                  chmod +x dist/exec/starwards-linux
                  # headless CI has no browser/display; auto-open would fail harmlessly, but
                  # STARWARDS_NO_OPEN=1 keeps the smoke test from depending on that being true.
                  STARWARDS_NO_OPEN=1 ./dist/exec/starwards-linux > /tmp/starwards-smoke.log 2>&1 &
                  PID=$!
                  trap 'kill "$PID" 2>/dev/null || true' EXIT

                  READY=""
                  for _ in $(seq 1 30); do
                      STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
                      if [ "$STATUS" = "200" ]; then
                          READY=1
                          break
                      fi
                      sleep 1
                  done
                  if [ -z "$READY" ]; then
                      echo "Server did not respond to /health within 30s"
                      cat /tmp/starwards-smoke.log
                      exit 1
                  fi

                  STATUS=$(curl -s -o /tmp/starwards-body.html -w '%{http_code}' http://localhost:8080/)
                  if [ "$STATUS" != "200" ]; then
                      echo "GET / returned $STATUS, expected 200"
                      exit 1
                  fi
                  grep -qi '<html' /tmp/starwards-body.html || {
                      echo "GET / body did not contain <html"
                      cat /tmp/starwards-body.html
                      exit 1
                  }

                  grep -q 'node v24\.' /tmp/starwards-smoke.log || {
                      echo "startup banner did not report node v24.x"
                      cat /tmp/starwards-smoke.log
                      exit 1
                  }

                  kill "$PID"
                  trap - EXIT
            - name: Check embedded Node version in Windows executable
              run: |
                  set -e
                  VERSION=$(strings dist/exec/starwards-win.exe | grep -m1 -E '^v24\.[0-9]+\.[0-9]+$')
                  if [ -z "$VERSION" ]; then
                      echo "Could not find an embedded v24.x.x node version string in starwards-win.exe"
                      exit 1
                  fi
                  echo "Embedded node version: $VERSION"
            - run: npm run build:unity
            - name: Store Unity Schemas
              uses: actions/upload-artifact@v4
              with:
                  name: Unity Schemas
                  path: modules/core/unity-schema
                  if-no-files-found: error

    Publish-Master-Prerelease:
        # Rolling pre-release so reviewers can grab the current master exe
        # without a GitHub login or a version tag. Gated on every other job
        # so a red build never updates it (see #2221).
        needs: [Test-Static, Test-Units, Test-E2e, Test-Visual, coverage-core, Build]
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        permissions:
            contents: write
        concurrency:
            group: release-master
            cancel-in-progress: true
        steps:
            - name: Download Windows executable
              uses: actions/download-artifact@v4
              with:
                  name: Windows executable
                  path: dist/exec
            - name: Publish rolling master pre-release
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const path = require('path');

                      const tagName = 'master-latest';
                      const sha = context.sha;
                      const shortSha = sha.substring(0, 7);
                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

                      const { data: commit } = await github.rest.git.getCommit({ ...context.repo, commit_sha: sha });
                      const commitSubject = commit.message.split('\n')[0];

                      // concurrency: only serializes, it doesn't order — a slower older
                      // push could still reach this point after a faster newer one. Bail
                      // if master has since moved past this run's commit.
                      const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'master' });
                      if (branch.commit.sha !== sha) {
                          core.notice(`master has moved to ${branch.commit.sha} since this run started (${sha}); skipping, a newer run will publish`);
                          return;
                      }

                      // Delete any existing release under this tag first, so a stale
                      // release object never blocks force-moving the tag below.
                      try {
                          const { data: existing } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: tagName });
                          await github.rest.repos.deleteRelease({ ...context.repo, release_id: existing.id });
                      } catch (error) {
                          if (error.status !== 404) throw error;
                      }

                      try {
                          await github.rest.git.updateRef({ ...context.repo, ref: `tags/${tagName}`, sha, force: true });
                      } catch (error) {
                          if (error.status !== 422) throw error;
                          await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tagName}`, sha });
                      }

                      const { data: release } = await github.rest.repos.createRelease({
                          ...context.repo,
                          tag_name: tagName,
                          name: `master @ ${shortSha}`,
                          prerelease: true,
                          body: `${commitSubject}\n\nCommit: ${sha}\nCI run: ${runUrl}`,
                      });

                      await github.rest.repos.uploadReleaseAsset({
                          ...context.repo,
                          release_id: release.id,
                          name: 'starwards.exe',
                          data: fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'dist', 'exec', 'starwards-win.exe')),
                      });
