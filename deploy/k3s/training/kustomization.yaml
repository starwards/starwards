# Overnight headless training on the home K3S cluster (namespace, archive volume, quota, priority class and
# the training-manager account are owned by the cluster repo: manifests/35-starwards-training.yaml).
#   kubectl apply -k deploy/k3s/training              (nightly CronJobs)
#   kubectl create -k deploy/k3s/training/jobs/<job>  (one-off sharded runs)
# Guide: docs/integration/ai-training-k3s-cluster-access.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: starwards-training
resources:
    - cronjob-suite.yaml
    - cronjob-branch.yaml
components:
    - params
