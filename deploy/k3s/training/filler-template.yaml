# Pod template of every filler Job (role=filler): one rolling cycle (docker/training/rolling.sh) on fresh
# seeds, then the rung's cumulative mining in /training-archive/mining/<rung>/LATEST.md. Never fires
# (suspended): the filler-dispatcher (dispatcher/) creates Jobs from it with LANE set.
apiVersion: batch/v1
kind: CronJob
metadata:
    name: filler-template
    labels: { app.kubernetes.io/name: starwards-training, starwards/job: filler-template }
spec:
    schedule: '0 0 1 1 *'
    timeZone: Europe/Amsterdam
    suspend: true
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 300
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5
    jobTemplate:
        metadata:
            labels: { role: filler, starwards/lane: branch }
        spec:
            backoffLimit: 0
            activeDeadlineSeconds: 5400 # a filler shard must turn over: 90 min hard stop
            ttlSecondsAfterFinished: 86400
            template:
                metadata:
                    labels: { app.kubernetes.io/name: starwards-training, starwards/job: rolling, role: filler, starwards/lane: branch }
                spec:
                    restartPolicy: Never
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 1000
                        runAsGroup: 1000
                        fsGroup: 1000
                        seccompProfile: { type: RuntimeDefault }
                    containers:
                        - name: filler
                          image: starwards-training
                          env:
                              - { name: JOB, value: rolling }
                              - { name: branch, value: branch }
                              # one rung per cycle in turn; branch: level set after each full turn
                              - { name: RUNGS, value: 'T3-directed,T3-incoming,T2-dock,W-waves' }
                              - { name: LEVEL_SETS, value: 'strategic,tactical|button:helms:afterBurner' }
                              - { name: TIMEOUTS, value: 'W-waves=1800' }
                              # the branch lane records and branches the first crew; the sweep plays all three
                              - { name: CREWS, value: 'crews/captain-reference.json,crews/captain-orders-reference.json,crews/captain-doctrine-reference.json' }
                              - { name: SEEDS, value: '4' }
                              - { name: BUDGET, value: '150' } # branches per cycle: sized for a <= 60 min shard
                              - { name: WORKERS, value: '4' }
                              - name: JOB_NAME
                                valueFrom: { fieldRef: { fieldPath: "metadata.labels['job-name']" } }
                          resources:
                              requests: { cpu: 500m, memory: 6656Mi } # WORKERS x 1.5 GiB + 0.5 GiB
                              limits: { memory: 7Gi }
                          securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities: { drop: [ALL] }
                          volumeMounts:
                              - { name: archive, mountPath: /training-archive }
                              - { name: tmp, mountPath: /tmp }
                    volumes:
                        - name: archive
                          persistentVolumeClaim: { claimName: training-archive }
                        - name: tmp
                          emptyDir: {}
