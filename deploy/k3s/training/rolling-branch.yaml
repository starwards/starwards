# Rolling branch lane: a filler cycle (role=filler) whenever the previous one ended, every 10 min at most.
# The two lanes hold 2 of the 3 slots around the clock and leave one for ad-hoc and nightly Jobs; with
# the dispatcher component they are suspended and the dispatcher creates fillers from their jobTemplate.
apiVersion: batch/v1
kind: CronJob
metadata:
    name: rolling-branch
    labels: { app.kubernetes.io/name: starwards-training, starwards/job: rolling-branch }
spec:
    schedule: '*/10 * * * *'
    timeZone: Europe/Amsterdam
    suspend: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 300
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5
    jobTemplate:
        metadata:
            labels: { role: filler, starwards/lane: branch }
        spec:
            backoffLimit: 0
            activeDeadlineSeconds: 7200 # a filler shard must turn over: 2 h hard stop, queued time included
            ttlSecondsAfterFinished: 86400
            template:
                metadata:
                    labels: { app.kubernetes.io/name: starwards-training, starwards/job: rolling, role: filler, starwards/lane: branch }
                spec:
                    restartPolicy: Never
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 1000
                        runAsGroup: 1000
                        fsGroup: 1000
                        seccompProfile: { type: RuntimeDefault }
                    containers:
                        - name: filler
                          image: starwards-training
                          env:
                              - { name: JOB, value: rolling }
                              - { name: LANE, value: branch }
                              # one rung per cycle in turn; branch: level set after each full turn
                              - { name: RUNGS, value: 'T3-directed,T3-incoming,T2-dock,W-waves' }
                              - { name: LEVEL_SETS, value: 'strategic,tactical|button:helms:afterBurner' }
                              - { name: TIMEOUTS, value: 'W-waves=1800' }
                              # the branch lane records and branches the first crew; the sweep plays all three
                              - { name: CREWS, value: 'crews/captain-reference.json,crews/captain-orders-reference.json,crews/captain-doctrine-reference.json' }
                              - { name: SEEDS, value: '48' }
                              - { name: SEEDS_BY_RUNG, value: 'W-waves=4,T2-dock=24' }
                              - { name: WORKERS_BY_RUNG, value: 'W-waves=1,T2-dock=2' } # 4 workers ran out of 7 GiB on these rungs
                              - { name: BUDGET, value: '1200' } # branches per cycle: sized for a <= 60 min shard
                              - { name: WORKERS, value: '4' } # one per core; 3 peaked at 1.8 GiB after the log-cache fix
                              - name: JOB_NAME
                                valueFrom: { fieldRef: { fieldPath: "metadata.labels['job-name']" } }
                          resources:
                              requests: { cpu: 500m, memory: 6656Mi } # request = limit, fits every node; 3 branch workers peaked at 1.8 GiB anon on 91cf0008
                              limits: { memory: 6656Mi }
                          securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities: { drop: [ALL] }
                          volumeMounts:
                              - { name: archive, mountPath: /training-archive }
                              - { name: tmp, mountPath: /tmp }
                    volumes:
                        - name: archive
                          persistentVolumeClaim: { claimName: training-archive }
                        - name: tmp
                          emptyDir: {}
