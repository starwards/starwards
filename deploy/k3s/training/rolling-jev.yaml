# Rolling Jev lane (role=filler, jev=true): a strategic and tactical corpus on fresh seeds whose
# alternatives the Jev captain proposes first (top 3 per point), within the spend guard: the lane's
# reservations and settlements go to /training-archive/jev-ledger.jsonl and a cycle that would pass
# JEV_CAP_USD sends no request. Forbid keeps it to one at a time. Suspended until reviewed.
apiVersion: batch/v1
kind: CronJob
metadata:
    name: rolling-jev
    labels: { app.kubernetes.io/name: starwards-training, starwards/job: rolling-jev }
spec:
    schedule: '*/10 * * * *'
    timeZone: Europe/Amsterdam
    suspend: true
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 300
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5
    jobTemplate:
        metadata:
            labels: { role: filler, starwards/lane: jev, jev: 'true' }
        spec:
            backoffLimit: 0
            activeDeadlineSeconds: 5400 # a filler shard must turn over: 90 min hard stop
            ttlSecondsAfterFinished: 86400
            template:
                metadata:
                    labels: { app.kubernetes.io/name: starwards-training, starwards/job: rolling, role: filler, starwards/lane: jev, jev: 'true' }
                spec:
                    restartPolicy: Never
                    securityContext:
                        runAsNonRoot: true
                        runAsUser: 1000
                        runAsGroup: 1000
                        fsGroup: 1000
                        seccompProfile: { type: RuntimeDefault }
                    containers:
                        - name: filler
                          image: starwards-training
                          env:
                              - { name: JOB, value: rolling }
                              - { name: LANE, value: jev }
                              # one rung per cycle in turn; branch: level set after each full turn
                              - { name: RUNGS, value: 'W-waves,W-waves,T3-directed,T3-incoming,T2-dock' } # the wave rung first
                              - { name: LEVEL_SETS, value: 'strategic,tactical|button:helms:afterBurner' }
                              - { name: TIMEOUTS, value: 'W-waves=1800' }
                              # the branch lane records and branches the first crew; the sweep plays all three
                              - { name: CREWS, value: 'crews/captain-reference.json,crews/captain-orders-reference.json,crews/captain-doctrine-reference.json' }
                              - { name: SEEDS, value: '4' }
                              - { name: BUDGET, value: '60' } # branches per cycle: sized for a <= 60 min shard
                              - { name: WORKERS, value: '3' } # 4 workers ran out of 7 GiB on T3 branch cycles
                              - { name: WORKERS_BY_RUNG, value: 'W-waves=1,T2-dock=2' } # 4 workers ran out of 7 GiB on these rungs
                              - { name: JEV_PROPOSALS, value: '3' }
                              - { name: JEV_CAP_USD, value: '10' } # the cluster's share of the $20 budget
                              - name: TYPESAFE_API_KEY
                                valueFrom: { secretKeyRef: { name: jev, key: TYPESAFE_API_KEY } }
                              - name: JOB_NAME
                                valueFrom: { fieldRef: { fieldPath: "metadata.labels['job-name']" } }
                          resources:
                              requests: { cpu: 500m, memory: 6656Mi } # WORKERS x 1.5 GiB + 0.5 GiB
                              limits: { memory: 7Gi }
                          securityContext:
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities: { drop: [ALL] }
                          volumeMounts:
                              - { name: archive, mountPath: /training-archive }
                              - { name: tmp, mountPath: /tmp }
                    volumes:
                        - name: archive
                          persistentVolumeClaim: { claimName: training-archive }
                        - name: tmp
                          emptyDir: {}
