# Low-priority tenant: the namespace quota rejects pods without this class. One training pod per node,
# because training pods reserve their real memory and nodes have 16.1 / 8.6 / 16.5 GiB free for training (node1/2/3, admin 2026-10-19).
- op: add
  path: /spec/template/spec/priorityClassName
  value: starwards-training
- op: add
  path: /spec/template/spec/affinity
  value:
      podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                    matchLabels: { app.kubernetes.io/name: starwards-training }
