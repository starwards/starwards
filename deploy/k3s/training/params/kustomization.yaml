# The cluster-specific parameters, shared by the CronJobs (../) and the one-off Jobs (../jobs).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
    - name: starwards-training
      newName: ghcr.io/starwards/starwards/training
      # the short commit built and pushed: shards of one run must share a tag
      newTag: aec5c73e
patches:
    - path: scheduling.yaml
      target: { kind: Job, labelSelector: app.kubernetes.io/name=starwards-training }
    - path: scheduling-cron.yaml
      target: { kind: CronJob, labelSelector: app.kubernetes.io/name=starwards-training }
