# The training archive: every shard, merged run and manifest lands here, laid out as helios/training-archive
# (<day>/headless/<run>/, <day>/branching/<run>-runs|-corpus/, <day>/suite/<crew>-<time>/, jev-cache/).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: training-archive
spec:
    # FILL: storage class. Shards of one Job run in parallel pods: ReadWriteMany (NFS, Longhorn RWX) lets
    # them spread over nodes; K3S's default local-path is ReadWriteOnce, so pin training to one node
    # (params/node-selector.yaml) and change the access mode to ReadWriteOnce. hostpath/ replaces the claim.
    storageClassName: STORAGE_CLASS
    accessModes: [ReadWriteMany]
    resources:
        requests:
            # FILL: size. A run records 0.4-3.5 MB (.sgr) plus its events; branches keep no recordings.
            storage: 50Gi
